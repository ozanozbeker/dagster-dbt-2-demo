[project]
name = "dagster-dbt-2-demo"
version = "0.1.0"
description = "Dagster and dbt 2.0 together, through a fork of dagster-dbt that fixes what breaks"
readme = "README.md"
authors = [
    { name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "dagster==1.13.26",
    "dagster-dbt",
    "dagster-webserver==1.13.26",
    "dbt==2.0.9",
]

[tool.uv.sources]
dagster-dbt = { git = "https://github.com/ozanozbeker/dagster-dbt", tag = "v0.29.26-fusion.3" }

[dependency-groups]
dev = ["pytest"]

[tool.dagster]
module_name = "dagster_dbt_2_demo.definitions"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
